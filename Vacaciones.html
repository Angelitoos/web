<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Vacaciones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        

    </style>
    <title>Calculadora de Vacaciones</title>
</head>
<body>
   
    <div class="head">
        <div class="logo">
            <img src="Añadir texto.png"  alt="logo">
            
        </div>
        <nav class="navbar">
            <a href="index.html">Inicio</a>
            <a href="Calculadora.html">Nomina</a>
            <a href="trabajadores.html">Trabajadores</a>
        </nav>
    </div>

 
    <div class="Titulo">Cálculo de Vacaciones</div>

    <div class="cuadros">
        <label for="Nombre">Nombre Del Empleado</label>
        <input type="text" id="Nombre" placeholder="Ingrese el Nombre del empleado">
    </div>

    <div class="cuadros">
        <div class="form-group">
            <label for="tipoSalario">Tipo de Salario:</label>
            <select id="tipoSalario">
                <option value="semanal">Semanal</option>
                <option value="quincenal">Quincenal</option>
                <option value="mensual">Mensual</option>
            </select>
        </div>
        <label for="Salario">Salario</label>
        <input type="number" id="Salario" placeholder="Ingrese el Salario del empleado">
    </div>

    <div class="cuadros">
        <label for="Antiguedad">Antigüedad</label>
        <select id="Antiguedad">
            <option value="1año">1 año</option>
            <option value="2años">2 años</option>
            <option value="3años">3 años</option>
            <option value="4años">4 años</option>
            <option value="5años">5 años</option>
            <option value="6-10años">6-10 años</option>
            <option value="11-15años">11-15 años</option>
            <option value="16-20años">16-20 años</option>
            <option value="21-25años">21-25 años</option>
            <option value="26-30años">26-30 años</option>
        </select>
    </div>

    <button onclick="agregarTrabajador()">Agregar Trabajador</button>

  
    <div class="trabajadores">
        <h2>Lista de Trabajadores</h2>
        <table id="tablaTrabajadores">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Salario Diario</th>
                    <th>Salario Total</th>
                    <th>Prima Vacacional</th>
                    <th>Vacaciones</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <script>
        const trabajadores = [];

        function calcularVacaciones() {
            const salario = parseFloat(document.getElementById('Salario').value);
            const tipoSalario = document.getElementById('tipoSalario').value;
            const antiguedad = document.getElementById('Antiguedad').value;

            let salarioDiario;
            if (tipoSalario === "semanal") {
                salarioDiario = salario / 7;
            } else if (tipoSalario === "quincenal") {
                salarioDiario = salario / 15;
            } else if (tipoSalario === "mensual") {
                salarioDiario = salario / 30;
            }

            let vacaciones;
            switch (antiguedad) {
                case "1año": vacaciones = salarioDiario * 12; break;
                case "2años": vacaciones = salarioDiario * 14; break;
                case "3años": vacaciones = salarioDiario * 16; break;
                case "4años": vacaciones = salarioDiario * 18; break;
                case "5años": vacaciones = salarioDiario * 20; break;
                case "6-10años": vacaciones = salarioDiario * 22; break;
                case "11-15años": vacaciones = salarioDiario * 24; break;
                case "16-20años": vacaciones = salarioDiario * 26; break;
                case "21-25años": vacaciones = salarioDiario * 28; break;
                case "26-30años": vacaciones = salarioDiario * 30; break;
            }

            const primaVacacional = vacaciones * 0.25;
            const total = salario + vacaciones + primaVacacional;

            return {
                salarioDiario: salarioDiario.toFixed(2),
                vacaciones: vacaciones.toFixed(2),
                primaVacacional: primaVacacional.toFixed(2),
                total: total.toFixed(2)
            };
        }

        function agregarTrabajador() {
            const nombre = document.getElementById('Nombre').value;
            const resultado = calcularVacaciones();

            trabajadores.push({
                nombre: nombre,
                salarioDiario: resultado.salarioDiario,
                vacaciones: resultado.vacaciones,
                primaVacacional: resultado.primaVacacional,
                total: resultado.total
            });

            actualizarTabla();
        }

        function eliminarTrabajador(index) {
            trabajadores.splice(index, 1);
            actualizarTabla();
        }

        function actualizarTabla() {
            const cuerpoTabla = document.getElementById('cuerpoTabla');
            cuerpoTabla.innerHTML = ""; // Limpiar la tabla

            trabajadores.forEach((trabajador, index) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${trabajador.nombre}</td>
                    <td>${trabajador.salarioDiario}</td>
                    <td>${trabajador.vacaciones}</td>
                    <td>${trabajador.primaVacacional}</td>
                    <td>${trabajador.vacaciones}</td>
                    <td>${trabajador.total}</td>
                    <td><button onclick="eliminarTrabajador(${index})">Eliminar</button></td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }
    </script>
</body>
</html>
